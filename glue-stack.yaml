AWSTemplateFormatVersion: '2010-09-09'

Resources:
  RawzoneBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-rawzone-bucket

  GlueJobRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-glue-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: glue.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSGlueServiceRole
        - arn:aws:iam::aws:policy/AWSGlueConsoleFullAccess
        - arn:aws:iam::aws:policy/AdministratorAccess

  IngestionJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub ${AWS::StackName}-glue-job
      Role: !GetAtt GlueJobRole.Arn
      Command:
        Name: glueetl
        ScriptLocation: s3://aps-group-cfn-bucket/gluejob/ingestion.py
        PythonVersion: '3'
      GlueVersion: '4.0'
      NumberOfWorkers: 2
      WorkerType: G.1X
      DefaultArguments:
        '--job_name': Media MySQL Ingestion Job
        '--metadata_secret_name': media-metadata-secret
        '--crawler_role': !GetAtt GlueJobRole.Arn
        '--region': !Ref AWS::Region
        '--additional-python-modules': pymysql

  MediaIngestionOnDemandTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: media-ingestion-ondemand-trigger
      Type: ON_DEMAND
      Actions:
        - JobName: !Ref IngestionJob
          Arguments:
            '--job_name': Media MySQL Ingestion Job
            '--metadata_secret_name': metadata
            '--crawler_role': !GetAtt GlueJobRole.Arn
            '--region': !Ref AWS::Region

  MediaIngestionScheduledTrigger:
    Type: AWS::Glue::Trigger
    Properties:
      Name: media-ingestion-scheduled-trigger
      Type: SCHEDULED
      Schedule: cron(0 2 * * ? *)
      StartOnCreation: true
      Actions:
        - JobName: !Ref IngestionJob
          Arguments:
            '--job_name': Media MySQL Ingestion Job
            '--metadata_secret_name': metadata
            '--crawler_role': !GetAtt GlueJobRole.Arn
            '--region': !Ref AWS::Region
  GenerateMetadataInsertsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-generate-metadata-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/AdministratorAccess
  PyMySQLLayer:
    Type: AWS::Lambda::LayerVersion
    Properties:
      LayerName: pymysql-layer
      Description: PyMySQL library
      CompatibleRuntimes:
        - python3.12
      Content:
        S3Bucket: aps-group-cfn-bucket
        S3Key: layers/pymysql.zip
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for GenerateMetadataInserts Lambda
      VpcId: vpc-0213f2e21ba305790
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          DestinationSecurityGroupId: sg-0e30737abf1c1929e
          Description: Allow MySQL to RDS
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: Allow HTTPS to VPC endpoints (S3, Secrets Manager)

  RdsInboundFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: sg-0e30737abf1c1929e
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !GetAtt LambdaSecurityGroup.GroupId
      Description: Allow MySQL from GenerateMetadataInserts Lambda
  GenerateMetadataInsertsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-generate-metadata-inserts
      Description: Generates metadata INSERT SQL statements from dataset/table inputs
      Runtime: python3.12
      Handler: generate_metadata_inserts.lambda_handler
      Role: !GetAtt GenerateMetadataInsertsRole.Arn
      Timeout: 30
      MemorySize: 128
      Layers: 
        - !Ref PyMySQLLayer
      VpcConfig:
       SecurityGroupIds:
        - !GetAtt LambdaSecurityGroup.GroupId
       SubnetIds: 
        - subnet-069d2faac0cabe50e
        - subnet-07609559c424fd07b
        - subnet-03ba5ce80e0053633
      Code:
        S3Bucket: aps-group-cfn-bucket
        S3Key: scripts/generate_metadata_inserts.zip

  # EventBridge rule: fires when a file is placed under inputs/ in aps-group-cfn-bucket
  # Requires EventBridge notifications to be enabled on the bucket:
  #   aws s3api put-bucket-notification-configuration \
  #     --bucket aps-group-cfn-bucket \
  #     --notification-configuration '{"EventBridgeConfiguration": {}}'
  MetadataInputS3EventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub ${AWS::StackName}-metadata-input-s3-rule
      Description: Triggers GenerateMetadataInsertsFunction when a file lands in
        s3://aps-group-cfn-bucket/inputs/
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - aps-group-cfn-bucket
          object:
            key:
              - prefix: inputs/
      State: ENABLED
      Targets:
        - Id: GenerateMetadataInsertsFunctionTarget
          Arn: !GetAtt GenerateMetadataInsertsFunction.Arn

  GenerateMetadataInsertsLambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt GenerateMetadataInsertsFunction.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MetadataInputS3EventRule.Arn
  GenerateCloudformationTemplateFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-generate-cloudformation-template
      Description: Generates Cloudformation Template
      Runtime: python3.12
      Handler: generate_cloudformation_template.lambda_handler
      Role: !GetAtt GenerateMetadataInsertsRole.Arn
      Timeout: 30
      MemorySize: 128
      Layers: 
        - !Ref PyMySQLLayer
      VpcConfig:
       SecurityGroupIds:
        - !GetAtt LambdaSecurityGroup.GroupId
       SubnetIds: 
        - subnet-069d2faac0cabe50e
        - subnet-07609559c424fd07b
        - subnet-03ba5ce80e0053633
      Code:
        S3Bucket: aps-group-cfn-bucket
        S3Key: scripts/generate_cloudformation_template.zip
